<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#FDFBF4;font-family:'Heebo',sans-serif;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.orb1{position:absolute;width:560px;height:560px;border-radius:50%;background:rgba(242,167,27,.18);filter:blur(80px);top:-200px;left:-140px}
.orb2{position:absolute;width:480px;height:480px;border-radius:50%;background:rgba(35,42,92,.09);filter:blur(80px);bottom:-200px;right:-120px}
.inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1100px;text-align:center;display:flex;flex-direction:column;align-items:center}
img{width:210px;margin-bottom:26px}
.pill{display:inline-block;border:1.5px solid rgba(35,42,92,.18);background:rgba(255,255,255,.7);border-radius:999px;padding:8px 26px;font-size:19px;font-weight:600;letter-spacing:.1em;color:#232A5C;margin-bottom:18px}
h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:88px;line-height:1.05;color:#1B2148;white-space:nowrap}
h1 span{color:#D98E0B}
p{margin-top:14px;font-size:26px;color:rgba(35,42,92,.7)}
.bar{position:absolute;bottom:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#F2A71B,#FBDFA8,#F2A71B)}
</style>
</head>
<body>
<div class="orb1"></div><div class="orb2"></div>
<div class="inner">
  <img src="logo.png">
  <div class="pill">ראש השנה תשפ״ז</div>
  <h1>שנה <span>טובה</span> ומתוקה</h1>
  <p>ברכה חמה מצוות אלומות והמיזמים שצומחים איתנו</p>
</div>
<div class="bar"></div>
</body>
</html>
